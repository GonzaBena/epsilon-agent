[project]
name = "epsilon"
version = "1.0.0"
description = "Agente personal local: notas, archivos, imagen a CSV, resúmenes con IA, memoria, voz y Telegram."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Gonzalo Benavente", email = "34586600+GonzaBena@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.149.0",
    "google-genai>=2.31.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "python-telegram-bot>=22.8",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Voz (Whisper local): uv sync --extra voz. Opcional: quien no la quiera no descarga nada.
voz = [
    "faster-whisper>=1.2.1",
    # faster-whisper 1.2.1 llama av.open(metadata_errors=...), que av 19 ya no acepta.
    "av<19",
]

[project.scripts]
epsilon = "epsilon.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Los tests viven fuera del paquete, en tests/ (un archivo o carpeta por cada parte del código).
testpaths = ["tests"]
